# Development overrides — loaded automatically by `docker compose up` alongside docker-compose.yml
# Do NOT commit secrets or machine-specific paths here.
#
# Usage:
#   docker compose up -d                   # dev mode (hot-reload via volume mount)
#   docker compose -f docker-compose.yml up -d   # production mode (baked image, no mount)

services:
  daq-navi:
    # Mount source code so changes are visible inside the container without rebuilding the image.
    # Flask+SocketIO is launched with FLASK_ENV=development so Werkzeug reloader picks up edits.
    volumes:
      - ./services/daq_navi:/app/services/daq_navi
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      MOCKUP_MODE: ${MOCKUP_MODE:-true}
